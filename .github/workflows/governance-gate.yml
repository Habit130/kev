# Generated by governance model version 3. Only the generator changes this file.
name: governance-gate

# The gate judges every PR into the default branch by the default branch: on
# pull_request_target, GitHub runs this file and the checkout below from the default branch,
# never from the PR. It reads the PR's metadata and git objects and never checks out or runs
# the PR's tree. New pushes and body edits run it again.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches:
      - "main"

# Read on contents and pull requests, plus posting the verdict as a check run on the head.
permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: governance-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance-gate:
    name: governance-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the default branch with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Judge the PR and post the verdict on its head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/governance/gate.py --post-check
