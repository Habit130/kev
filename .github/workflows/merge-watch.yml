# Generated by governance model version 3. Only the generator changes this file.
name: merge-watch

# Merge watch records misses after merges, as `miss` issues, and never blocks anything: it
# is not a required check. On a push to the default branch it judges each merged PR's head;
# when a push-triggered run of any other workflow on the default branch completes, it
# records a red default branch. Its own name is negated in the `workflows` glob, so it never
# runs on its own completion.
on:
  push:
    branches:
      - "main"
  workflow_run:
    types: [completed]
    branches:
      - "main"
    workflows:
      - "**"
      - "!merge-watch"

# Exactly these six; listing any sets every unlisted one to none.
permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: read
  statuses: read
  actions: read

jobs:
  merge-watch:
    name: merge-watch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the misses this event shows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/governance/merge_watch.py --post
